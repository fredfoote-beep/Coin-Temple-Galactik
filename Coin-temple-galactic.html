<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Temple: Galactic</title>
<style>
:root{color-scheme:dark;--bg:#0b0418;--fg:#ffe9a8;--a:#ff3df2;--b:#27f5e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(96vw,calc(96vh*.75),480px);aspect-ratio:3/4;border:3px solid var(--a);box-shadow:0 0 18px var(--a),inset 0 0 18px var(--b)}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:none}
#ov{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;background:rgba(11,4,24,.88);padding:10px;overflow:auto;font-size:13px}
#ov[hidden]{display:none}
h1{margin:0;font-size:21px;color:var(--b);text-shadow:2px 2px var(--a);letter-spacing:2px}
h2{margin:0;font-size:17px;color:var(--a)}
.btn{font:bold 13px "Courier New",monospace;color:#0b0418;background:var(--fg);border:0;padding:8px 14px;cursor:pointer;box-shadow:3px 3px var(--a)}
.btn.alt{background:var(--b)}.btn:disabled{opacity:.35;cursor:default}
.up{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:300px;text-align:left}
.up small{display:block}
input{font:bold 20px "Courier New",monospace;width:72px;text-align:center;background:#000;color:var(--b);border:2px solid var(--a);padding:4px;text-transform:uppercase}
ol{margin:0;padding:0;list-style:none;font-size:14px}
ol li{display:flex;gap:14px;justify-content:space-between;min-width:170px}
.sp{display:block;border:2px dashed var(--b);padding:5px 10px;color:var(--fg);text-decoration:none;font-size:12px}
.sp b{color:var(--a)}small{opacity:.8}
</style></head><body>
<div id="wrap"><canvas></canvas><div id="ov"></div></div>
<script>
/* ===== CONFIG: edit for your WordPress site ===== */
const CFG={title:'COIN TEMPLE: GALACTIC',
 sponsor:{enabled:true,name:'YOUR BRAND HERE',tagline:'Sponsor the Temple',url:'https://example.com',bonus:5},
 endpoint:null /* optional WP REST URL: GET returns [{n,s}], POST {n,s} */};
const $=s=>document.querySelector(s),ov=$('#ov'),cv=$('canvas'),g=cv.getContext('2d'),W=240,H=320;cv.width=W;cv.height=H;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function emit(name,data){const d={game:'coin-temple-galactic',name,...data};try{window.dispatchEvent(new CustomEvent('coin-temple',{detail:d}));parent!==window&&parent.postMessage(d,'*')}catch(e){}}
let ac;function snd(f,d=.07,ty='square'){try{ac=ac||new AudioContext();const o=ac.createOscillator(),v=ac.createGain();o.type=ty;o.frequency.value=f;v.gain.value=.04;o.connect(v);v.connect(ac.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const LB={async get(){if(CFG.endpoint)try{return await(await fetch(CFG.endpoint)).json()}catch(e){}return ld('cg_lb',[])},
async add(n,s){let l=ld('cg_lb',[]);l.push({n,s});l.sort((a,b)=>b.s-a.s);l=l.slice(0,10);sv('cg_lb',l);
if(CFG.endpoint)try{await fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n,s})})}catch(e){}return l}};
const BADGES=[['Seed',50],['Bloom',250],['Sage',1000],['Oracle',5000]];
const pf=()=>ld('cg_pf',{plays:0,coins:0,best:0,streak:0,last:'',wave:0});
function sponsorHTML(){const s=CFG.sponsor;if(!s.enabled)return'';const c=ld('cg_sp',{imp:0,clk:0});c.imp++;sv('cg_sp',c);emit('sponsor_impression',{sponsor:s.name});
return`<a class="sp" href="${s.url}" target="_blank" rel="noopener sponsored" onclick="emit('sponsor_click',{sponsor:'${s.name}'})">Presented by <b>${s.name}</b><br><small>${s.tagline}</small></a>`}
/* ===== game state ===== */
const UP=[['fire','RAPID FIRE','Shoot faster',5],['multi','MULTI SHOT','Extra beams',2],['shield','SHIELD','Absorbs hits each wave',3],['magnet','COIN MAGNET','Pulls coins in',3],['value','COIN VALUE','Coins worth more',3]];
let st='title',t=0,hue=0,score=0,lives=3,wave=1,cash=0,got=0,px=W/2,U={},shots=[],eb=[],en=[],cn=[],pops=[],cd=0,inv=0,flash=0,dive=0,clearT=0,shield=0,tx=null,bossMax=1;const keys={};
const cost=k=>12*(U[k]+1);
function fol(cx,cy,r,col){g.strokeStyle=col;g.lineWidth=1;g.beginPath();g.arc(cx,cy,r,0,7);for(let i=0;i<6;i++){const a=i*Math.PI/3;g.moveTo(cx+Math.cos(a)*r+r,cy+Math.sin(a)*r);g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,r,0,7)}g.stroke()}
function bg(){g.fillStyle='#0b0418';g.fillRect(0,0,W,H);const r=20,dy=r*.866;
for(let j=-1;j<H/dy+1;j++)for(let i=-1;i<W/r+1;i++){g.strokeStyle=`hsl(${(hue+i*14+j*9)%360},90%,${st==='play'?30:26}%)`;g.beginPath();g.arc(i*r+(j&1)*r/2,j*dy,r,0,7);g.stroke()}}
function draw(){bg();
if(st!=='play'){fol(W/2,H/2,28+Math.sin(t/20)*3,`hsl(${hue},100%,65%)`);return}
cn.forEach(c=>{const w=Math.abs(Math.cos(t/8+c.x))*3+1;g.fillStyle=c.s?'#27f5e0':'#ffd23d';g.beginPath();g.ellipse(c.x,c.y,w,4,0,0,7);g.fill()});
en.forEach((e,i)=>{const col=`hsl(${(hue+e.r*50)%360},100%,60%)`;
if(e.k==='b'){fol(e.x,e.y,12,col);g.fillStyle='#ff3df2';g.fillRect(W/2-30,6,60*e.hp/bossMax,3)}
else if(e.k==='s'){g.fillStyle='#27f5e0';g.beginPath();g.arc(e.x,e.y,6,0,7);g.fill();g.fillStyle='#0b0418';g.font='bold 6px monospace';g.fillText('AD',e.x-5,e.y+2)}
else fol(e.x,e.y,3,col)});
g.fillStyle='#ffe9a8';shots.forEach(s=>g.fillRect(s.x-1,s.y-4,2,5));
g.fillStyle='#ff3df2';eb.forEach(b=>{g.beginPath();g.arc(b.x,b.y,2,0,7);g.fill()});
if(!(inv>0&&t%6<3)){fol(px,H-22,4,'#27f5e0');g.fillStyle='#27f5e0';g.fillRect(px-1,H-32,2,5)}
if(shield>0){g.strokeStyle='#27f5e0';g.beginPath();g.arc(px,H-22,11,0,7);g.stroke()}
pops.forEach(p=>{g.fillStyle='#fff';g.font='bold 8px monospace';g.fillText(p.s,p.x,p.y)});
g.fillStyle='#ffe9a8';g.font='bold 9px monospace';g.fillText('SCORE '+score,4,11);g.fillText('WAVE '+wave,4,22);g.fillText('$'+cash,4,H-4);
for(let i=0;i<lives;i++)fol(W-10-i*13,10,2,'#ff3df2');
if(flash>0){g.fillStyle='rgba(255,0,80,.35)';g.fillRect(0,0,W,H);flash--}}
function startWave(){shield=U.shield;eb=[];shots=[];clearT=0;en=[];
if(wave%5===0){bossMax=30+wave*5;en.push({k:'b',hx:W/2,hy:55,x:W/2,y:-30,hp:bossMax,r:0,ph:0})}
else{const rows=Math.min(2+(wave>>1),5);for(let r=0;r<rows;r++)for(let c=0;c<7;c++)en.push({k:'n',hx:36+c*28,hy:32+r*18,x:36+c*28,y:-20-r*12,hp:wave>3&&r===0?2:1,r,s:'f',ph:Math.random()*6});
if(CFG.sponsor.enabled&&wave%2===0){const e=en[(Math.random()*en.length)|0];e.k='s';e.hp=3}}
st='play';ov.hidden=true}
function hurt(){if(inv>0)return;if(shield>0){shield--;inv=40;snd(300,.1);return}lives--;inv=90;flash=8;snd(90,.3,'sawtooth');if(lives<=0)over()}
function kill(e){en.splice(en.indexOf(e),1);snd(e.k==='b'?120:200,.12,'sawtooth');
const pts=e.k==='b'?500:e.k==='s'?100:20;score+=pts;pops.push({s:'+'+pts,x:e.x-6,y:e.y,l:30});
if(e.k==='b')for(let i=0;i<14;i++)cn.push({x:e.x+(Math.random()-.5)*50,y:e.y+(Math.random()-.5)*20,v:2});
else cn.push({x:e.x,y:e.y,v:e.k==='s'?CFG.sponsor.bonus:1,s:e.k==='s'})}
function upd(){
if(keys.ArrowLeft||keys.a)px-=3;if(keys.ArrowRight||keys.d)px+=3;if(tx!==null)px+=(tx-px)*.3;px=Math.max(10,Math.min(W-10,px));if(inv>0)inv--;
if(--cd<=0){cd=Math.max(7,22-3*(U.fire||0));const n=1+(U.multi||0);for(let i=0;i<n;i++)shots.push({x:px,y:H-30,vx:(i-(n-1)/2)*.7});snd(900,.03)}
shots.forEach(s=>{s.y-=5;s.x+=s.vx});shots=shots.filter(s=>s.y>-6);
const sw=Math.sin(t/60)*18;
if(--dive<=0&&en.length){dive=Math.max(35,130-wave*8);const c=en.filter(e=>e.k!=='b'&&e.s==='f');if(c.length){const e=c[(Math.random()*c.length)|0];e.s='d'}}
for(const e of [...en]){
if(e.k==='b'){e.x+=(e.hx+Math.sin(t/40)*70-e.x)*.05;e.y+=(e.hy-e.y)*.05;if(t%40===0)for(let i=-1;i<=1;i++)eb.push({x:e.x,y:e.y+10,vx:i*.7,vy:1.6})}
else if(e.s==='d'){e.y+=2+wave*.1;e.x+=Math.sin(e.y/20+e.ph)*1.6;if(Math.random()<.01)eb.push({x:e.x,y:e.y,vx:(px-e.x)/80,vy:1.8});if(e.y>H+10){e.y=-10;e.s='f'}}
else{e.x+=(e.hx+sw-e.x)*.06;e.y+=(e.hy-e.y)*.06;if(Math.random()<.0005*wave)eb.push({x:e.x,y:e.y,vx:0,vy:1.6})}
const R=e.k==='b'?14:7;
for(const s of shots)if(!s.d&&Math.abs(s.x-e.x)<R&&Math.abs(s.y-e.y)<R){s.d=1;if(--e.hp<=0){kill(e);break}}
if(en.includes(e)&&Math.abs(e.x-px)<R&&Math.abs(e.y-(H-22))<R){hurt();if(e.k!=='b')kill(e)}}
shots=shots.filter(s=>!s.d);
eb.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(Math.abs(b.x-px)<5&&Math.abs(b.y-(H-22))<6){b.d=1;hurt()}});eb=eb.filter(b=>!b.d&&b.y<H+5);
const mr=20+25*(U.magnet||0);
cn.forEach(c=>{c.y+=1;const dx=px-c.x,dy=H-22-c.y,d=Math.hypot(dx,dy);if(d<mr){c.x+=dx/d*2.5;c.y+=dy/d*2.5}
if(d<9){c.d=1;const v=c.v*(1+(U.value||0));cash+=v;got++;score+=v*5;snd(c.s?1300:700,.05)}if(c.y>H+5)c.d=1});cn=cn.filter(c=>!c.d);
pops.forEach(p=>{p.y-=.6;p.l--});pops=pops.filter(p=>p.l>0);
if(!en.length&&!clearT)clearT=70;if(clearT&&--clearT===0&&st==='play'){wave++;shop()}}
function pips(k,m){return'■'.repeat(U[k])+'□'.repeat(m-U[k])}
function shop(){st='shop';emit('wave_clear',{wave:wave-1,score});
show(`<h2>WAVE ${wave-1} CLEARED</h2><div>Coins <b style="color:#ffd23d">$${cash}</b> · Lives ${lives}</div>`+
UP.map(([k,n,d,m])=>`<div class="up"><span>${n} ${pips(k,m)}<small>${d}</small></span><button class="btn alt" ${U[k]>=m||cash<cost(k)?'disabled':''} onclick="buy('${k}')">${U[k]>=m?'MAX':'$'+cost(k)}</button></div>`).join('')+
`<div class="up"><span>EXTRA LIFE<small>Max 5 lives</small></span><button class="btn alt" ${lives>=5||cash<40?'disabled':''} onclick="buy('life')">$40</button></div>
${sponsorHTML()}<button class="btn" onclick="startWave()">LAUNCH WAVE ${wave}${wave%5===0?' (BOSS)':''}</button>`)}
function buy(k){if(k==='life'){if(cash<40||lives>=5)return;cash-=40;lives++}else{const c=cost(k);if(cash<c)return;cash-=c;U[k]++}snd(1000,.1);shop()}
function start(){const p=pf(),today=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
if(p.last!==today){p.streak=p.last===y?p.streak+1:1;p.last=today}p.plays++;sv('cg_pf',p);
U={fire:0,multi:0,shield:0,magnet:0,value:0};score=0;lives=3;wave=1;cash=0;got=0;cn=[];pops=[];dive=60;inv=0;emit('game_start',{streak:p.streak});startWave()}
function over(){st='over';const p=pf(),old=p.coins;p.coins+=got;p.best=Math.max(p.best,score);p.wave=Math.max(p.wave,wave);sv('cg_pf',p);
const nb=BADGES.filter(b=>old<b[1]&&p.coins>=b[1]).map(b=>b[0]),next=BADGES.find(b=>p.coins<b[1]);emit('game_over',{score,wave,coins:got,total:p.coins,streak:p.streak});
show(`<h2>GAME OVER</h2><div>Score <b>${score}</b> · Wave ${wave}</div>
<small>Spirit Points ${p.coins} · Day streak ${p.streak} · Best ${p.best}</small>
${nb.length?`<div style="color:#27f5e0">★ New badge: ${nb.join(', ')} ★</div>`:''}${next?`<small>Next badge ${next[0]} at ${next[1]} points</small>`:''}
<div>Initials: <input id="nm" maxlength="3" value="${ld('cg_nm','')}"></div>
<button class="btn" onclick="save()">SAVE SCORE</button>${sponsorHTML()}<button class="btn alt" onclick="start()">PLAY AGAIN</button>`)}
async function save(){const n=($('#nm').value||'AAA').toUpperCase().replace(/[^A-Z0-9]/g,'')||'AAA';sv('cg_nm',n);await LB.add(n,score);board()}
async function board(){st='board';show('<h2>TOP 10 STAR SEEKERS</h2><small>loading…</small>');const l=await LB.get();
show(`<h2>TOP 10 STAR SEEKERS</h2><ol>${l.length?l.map((e,i)=>`<li><span>${i+1}. ${e.n}</span><b>${e.s}</b></li>`).join(''):'<li>No scores yet. Be the first!</li>'}</ol>${sponsorHTML()}<button class="btn" onclick="start()">PLAY</button><button class="btn alt" onclick="title()">MENU</button>`)}
function title(){st='title';show(`<h1>${CFG.title}</h1><div style="color:#ff3df2">✿ FLOWER OF LIFE ✿</div>
<small>Your ship auto-fires.<br>Shoot the swarm, grab the coins,<br>buy upgrades between waves.<br>Boss every 5th wave. Hunt the AD ships!</small>
<button class="btn" onclick="start()">START</button><button class="btn alt" onclick="board()">LEADERBOARD</button>${sponsorHTML()}<small>← → / A D or drag to move</small>`)}
function show(h){ov.innerHTML=h;ov.hidden=false}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='Enter'&&(st==='title'||st==='over'||st==='board')&&!/INPUT/.test(e.target.tagName))start();if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=0);
const mv=e=>{const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W};
cv.addEventListener('pointerdown',mv);cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')mv(e)});
cv.addEventListener('pointerup',()=>tx=null);cv.addEventListener('pointerleave',()=>tx=null);
(function loop(){t++;hue=(hue+.6)%360;draw();if(st==='play')upd();requestAnimationFrame(loop)})();
title();
</script></body></html>
